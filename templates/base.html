<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Magela Diesel{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#0B2D8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MD Orçamentos">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% with mensagens = get_flashed_messages(with_categories=true) %}
{% if mensagens %}
<div class="flash-area">
    {% for categoria, mensagem in mensagens %}
    <div class="flash flash-{{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
{% block conteudo %}{% endblock %}
</body>
</html>
